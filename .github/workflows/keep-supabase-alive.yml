name: Keep Supabase Alive

on:
  schedule:
    - cron: "0 12 * * 3"
  workflow_dispatch:

jobs:

  ping-milicia:
    name: Ping — Milicia Golf Tour
    runs-on: ubuntu-latest
    steps:
      - name: Query tabla fechas (Milicia)
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: ${{ secrets.SUPABASE_KEY_MILICIA }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_KEY_MILICIA }}" \
            "${{ secrets.SUPABASE_URL_MILICIA }}/rest/v1/fechas?select=num&limit=1")
          echo "HTTP status: $STATUS"
          if [ "$STATUS" = "200" ] || [ "$STATUS" = "404" ]; then
            echo "✅ Milicia Golf Tour — Supabase activo"
          else
            echo "⚠️  Respuesta inesperada: $STATUS"
            exit 1
          fi

  ping-portfolio:
    name: Ping — Portfolio Analyst
    runs-on: ubuntu-latest
    steps:
      - name: Query REST API root (Portfolio)
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: ${{ secrets.SUPABASE_KEY_PORTFOLIO }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_KEY_PORTFOLIO }}" \
            "${{ secrets.SUPABASE_URL_PORTFOLIO }}/rest/v1/")
          echo "HTTP status: $STATUS"
          if [ "$STATUS" = "200" ]; then
            echo "✅ Portfolio Analyst — Supabase activo"
          else
            echo "⚠️  Respuesta inesperada: $STATUS"
            exit 1
          fi
